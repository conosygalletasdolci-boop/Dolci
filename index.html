<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- MUY IMPORTANTE PARA QUE SE VEA BIEN EN CELULAR -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dolci | Fábrica de Galletas</title>

    <!-- FUENTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- ================================================= -->
    <!-- CONTENEDOR PRINCIPAL -->
    <!-- ================================================= -->

    <div class="pagina">


        <!-- ================================================= -->
        <!-- HERO / PARTE SUPERIOR -->
        <!-- ================================================= -->

        <header class="hero">


            <!-- DECORACIÓN CON PRODUCTOS -->
            <div class="decoracion decoracion-izquierda">

                <img
                    src="images/conos-fondo-izquierda.png"
                    alt="Conos de galleta">

            </div>


            <div class="decoracion decoracion-derecha">

                <img
                    src="images/conos-fondo-derecha.png"
                    alt="Productos Dolci">

            </div>


            <!-- CONTENIDO CENTRAL -->

            <div class="hero-contenido">


                <!-- LOGO -->

                <div class="logo-contenedor">

                    <img
                        class="logo-principal"
                        src="images/logo-dolci.png"
                        alt="Dolci Fábrica de Galletas">

                </div>


                <!-- FRASE DERECHA -->

                <div class="frase-principal">

                    <p>
                        El sabor<br>
                        que hace<br>
                        tus momentos<br>
                        más especiales
                    </p>

                    <div class="corazon">
                        ♡
                    </div>

                </div>


                <!-- NOMBRE -->

                <div class="marca">

                    <h1>Dolci</h1>

                    <p>
                        Conos, galletas y más<br>
                        para tus mejores momentos
                    </p>

                </div>


            </div>

        </header>



        <!-- ================================================= -->
        <!-- BENEFICIOS -->
        <!-- ================================================= -->

        <section class="beneficios">


            <div class="beneficio">

                <div class="beneficio-icono">
                    🚚
                </div>

                <p>
                    Pedidos<br>
                    rápidos
                </p>

            </div>



            <div class="beneficio">

                <div class="beneficio-icono">
                    🛡️
                </div>

                <p>
                    Productos<br>
                    de calidad
                </p>

            </div>



            <div class="beneficio">

                <div class="beneficio-icono">
                    ♡
                </div>

                <p>
                    Hechos<br>
                    con pasión
                </p>

            </div>



            <div class="beneficio">

                <div class="beneficio-icono">
                    👥
                </div>

                <p>
                    Atención<br>
                    personalizada
                </p>

            </div>


        </section>



        <!-- ================================================= -->
        <!-- CATEGORÍAS -->
        <!-- ================================================= -->

        <main class="contenido">


            <section class="categorias">


                <!-- TÍTULO -->

                <div class="titulo-categorias">

                    <h2>
                        Nuestras categorías
                    </h2>

                    <p>
                        Selecciona una categoría para ver nuestros productos
                    </p>

                </div>



                <!-- TARJETAS -->

                <div class="categorias-grid">


                    <!-- CONOS -->

                    <button
                        class="categoria"
                        data-categoria="conos">

                        <div class="categoria-imagen">

                            <img
                                src="images/conos.jpg"
                                alt="Conos">

                        </div>

                        <div class="categoria-nombre">
                            Conos
                        </div>

                    </button>



                    <!-- GALLETAS -->

                    <button
                        class="categoria"
                        data-categoria="galletas">

                        <div class="categoria-imagen">

                            <img
                                src="images/galletas.jpg"
                                alt="Galletas">

                        </div>

                        <div class="categoria-nombre">
                            Galletas
                        </div>

                    </button>



                    <!-- CANASTAS -->

                    <button
                        class="categoria"
                        data-categoria="canastas">

                        <div class="categoria-imagen">

                            <img
                                src="images/canastas.jpg"
                                alt="Canastas">

                        </div>

                        <div class="categoria-nombre">
                            Canastas
                        </div>

                    </button>



                    <!-- OBLEAS -->

                    <button
                        class="categoria"
                        data-categoria="obleas">

                        <div class="categoria-imagen">

                            <img
                                src="images/obleas.jpg"
                                alt="Obleas">

                        </div>

                        <div class="categoria-nombre">
                            Obleas
                        </div>

                    </button>



                    <!-- BARQUILLOS -->

                    <button
                        class="categoria"
                        data-categoria="barquillos">

                        <div class="categoria-imagen">

                            <img
                                src="images/barquillos.jpg"
                                alt="Barquillos">

                        </div>

                        <div class="categoria-nombre">
                            Barquillos
                        </div>

                    </button>


                </div>



                <!-- BOTÓN HACER PEDIDO -->

                <button
                    class="boton-pedido"
                    id="abrirPedido">

                    <span class="carrito">
                        🛒
